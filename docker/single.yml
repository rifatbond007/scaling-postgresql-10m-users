# Steps 0-4: Postgres primary (+ PgBouncer, profile "pool"; + 2 read replicas, profile "replicas")
# Scaled down for a 7 GB laptop.
name: pglab
services:
  pg:
    image: postgres:16
    container_name: pg
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    shm_size: 1g
    mem_limit: 2g
    memswap_limit: 2g     # no swap: if pg runs out of RAM only pg suffers, not the laptop
    cpus: 4
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c max_connections=${PG_MAX_CONN:-100}
      -c shared_preload_libraries=pg_stat_statements
      -c track_io_timing=on
      -c max_wal_size=4GB

  # Step 3: connection pooler (start with: --profile pool up -d pgbouncer)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    profiles: ["pool"]
    depends_on: [pg]
    ports: ["6432:6432"]
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    cpus: 1
    mem_limit: 256m
    ulimits: { nofile: { soft: 10000, hard: 10000 } }

  # Step 4: streaming read replicas (first run docker/replica/setup-primary.sh)
  replica1: &replica
    image: postgres:16
    container_name: replica1
    profiles: ["replicas"]
    depends_on: [pg]
    user: postgres
    environment: { SLOT: replica1_slot, REPLICATOR_PASSWORD: "${REPLICATOR_PASSWORD:?set REPLICATOR_PASSWORD in .env}" }
    volumes: ["replica1data:/var/lib/postgresql/data", "./replica/start-replica.sh:/start-replica.sh:ro"]
    entrypoint: ["/start-replica.sh"]
    ports: ["5433:5432"]
    shm_size: 512m
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
  replica2:
    <<: *replica
    container_name: replica2
    environment: { SLOT: replica2_slot, REPLICATOR_PASSWORD: "${REPLICATOR_PASSWORD:?set REPLICATOR_PASSWORD in .env}" }
    volumes: ["replica2data:/var/lib/postgresql/data", "./replica/start-replica.sh:/start-replica.sh:ro"]
    ports: ["5434:5432"]

  # pgbench / psql / python client (run with: run --rm bench '...'); nothing installed on the host
  bench:
    build: { context: ., dockerfile: bench.Dockerfile }
    image: pglab-bench
    profiles: ["tools"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      PGHOST: pg
      PGUSER: postgres
      PGDATABASE: app
      HOME: /tmp
    volumes: ["../bench:/bench", "../raw:/raw"]
    working_dir: /raw
    user: "${UID:-1000}:${GID:-1000}"   # write results as the host user, not root
    cpus: 4
    ulimits: { nofile: { soft: 10000, hard: 10000 } }
    entrypoint: ["bash", "-c"]

volumes: { pgdata: {}, replica1data: {}, replica2data: {} }
