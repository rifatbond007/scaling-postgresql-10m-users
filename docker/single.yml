# Steps 0-3: single Postgres node (+ PgBouncer, profile "pool") (scaled down for a 7 GB laptop)
name: pglab
services:
  pg:
    image: postgres:16
    container_name: pg
    environment:
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    shm_size: 1g
    mem_limit: 2g
    memswap_limit: 2g     # no swap: if pg runs out of RAM only pg suffers, not the laptop
    cpus: 4
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c max_connections=${PG_MAX_CONN:-100}
      -c shared_preload_libraries=pg_stat_statements
      -c track_io_timing=on
      -c max_wal_size=4GB

  # Step 3: connection pooler (start with: --profile pool up -d pgbouncer)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: pgbouncer
    profiles: ["pool"]
    depends_on: [pg]
    ports: ["6432:6432"]
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    cpus: 1
    mem_limit: 256m
    ulimits: { nofile: { soft: 10000, hard: 10000 } }

  # pgbench / psql / python client (run with: run --rm bench '...'); nothing installed on the host
  bench:
    build: { context: ., dockerfile: bench.Dockerfile }
    image: pglab-bench
    profiles: ["tools"]
    environment:
      PGPASSWORD: lab
      PGHOST: pg
      PGUSER: postgres
      PGDATABASE: app
      HOME: /tmp
    volumes: ["../bench:/bench", "../raw:/raw"]
    working_dir: /raw
    user: "${UID:-1000}:${GID:-1000}"   # write results as the host user, not root
    cpus: 4
    ulimits: { nofile: { soft: 10000, hard: 10000 } }
    entrypoint: ["bash", "-c"]

volumes: { pgdata: {} }
