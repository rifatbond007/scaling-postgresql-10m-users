; Step 3: PgBouncer in transaction mode in front of the single node
[databases]
app = host=pg port=5432 dbname=app

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres

pool_mode = transaction
; real server connections per (db, user). Proposal: start at CPU cores x 2-4 (pg has 4 CPUs -> 8-16).
; Step 3 found: smaller is better when CPU-bound, larger when backends wait on disk.
default_pool_size = 20
max_client_conn = 3000
max_prepared_statements = 200

; don't log every connect/disconnect of 2,000 clients
log_connections = 0
log_disconnections = 0
